<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paysawa documentation</title>
<meta name="description" content="Paysawa API documentation: collect and withdraw mobile money (MTN, Orange), payment links, webhooks and the Python SDK.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Menu">&#9776;</button>
  <a class="brand" href="#/overview"><span class="logo">P</span><span>Paysawa <em id="brand-sub">Docs</em></span></a>
  <input id="search" class="search" type="search" placeholder="Search the docs" aria-label="Search">
  <label class="base"><span id="base-label">API base URL</span><input id="base-input" type="text" spellcheck="false" autocapitalize="off" aria-label="API base URL"></label>
  <span id="version" class="version"></span>
  <button id="lang-btn" class="icon-btn lang-btn" type="button" aria-label="Language">FR</button>
  <button id="theme-btn" class="icon-btn theme-btn" type="button" aria-label="Switch light/dark theme">&#9680;</button>
</header>
<div id="scrim" class="scrim"></div>
<div class="layout">
  <nav id="nav" class="sidebar" aria-label="Documentation"></nav>
  <main id="content" class="content"><noscript>This documentation needs JavaScript. The same content is available as Markdown files in the docs folder (English) and docs/fr (French).</noscript></main>
</div>
<script src="assets/content.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
